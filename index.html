<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MASTER ADMIN | TECH QA</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-white p-6 md:p-12 font-sans">

    <header class="flex justify-between items-center border-b border-zinc-900 pb-10 mb-12">
        <h1 class="text-3xl font-black tracking-tighter text-blue-500 italic uppercase">System Overseer</h1>
        <div id="status" class="text-[9px] font-black px-4 py-1 rounded-full border border-zinc-800 uppercase tracking-widest">Syncing...</div>
    </header>

    <div class="grid lg:grid-cols-3 gap-10">
        <div class="bg-zinc-900/50 p-8 rounded-[3rem] border border-zinc-800 shadow-2xl">
            <h2 class="text-xl font-bold mb-8 text-green-500 italic">Balance Update</h2>
            <div class="space-y-4">
                <input id="target-user" type="text" placeholder="Username" class="w-full bg-black p-4 rounded-2xl border border-zinc-800 outline-none focus:border-green-500">
                <input id="add-amt" type="number" placeholder="Amount (e.g. 5000)" class="w-full bg-black p-4 rounded-2xl border border-zinc-800 outline-none focus:border-green-500">
                <button onclick="updateBalance()" class="w-full bg-green-600 py-4 rounded-2xl font-black uppercase text-xs tracking-widest">Push Balance</button>
            </div>
        </div>

        <div class="lg:col-span-2 bg-zinc-900/50 p-8 rounded-[3rem] border border-zinc-800 shadow-2xl">
            <h2 class="text-xl font-bold mb-8 text-blue-500 italic">Live Task Unlocks</h2>
            <div id="purchase-list" class="grid grid-cols-1 md:grid-cols-2 gap-4 max-h-96 overflow-y-auto pr-2">
                <p class="text-zinc-700 italic text-sm">Waiting for transactions...</p>
            </div>
        </div>

        <div class="lg:col-span-3 bg-zinc-900/50 p-8 rounded-[3rem] border border-zinc-800 shadow-2xl">
            <h2 class="text-xl font-bold mb-8 text-indigo-400 italic text-center uppercase tracking-widest">Remote Access Control</h2>
            <div id="user-list" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-6">
                <p class="text-zinc-700 italic text-center col-span-full py-20">Loading Database...</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, update, get, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBMUzq53tvH-ntEJsfRj08ReeGMSd_RmrY",
            databaseURL: "https://techqaportal-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "techqaportal"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        onValue(ref(db, ".info/connected"), (s) => {
            const el = document.getElementById('status');
            el.innerText = s.val() ? "● System Online" : "● Database Offline";
            el.className = s.val() ? "text-green-500 border-green-500/20 px-4 py-1 rounded-full text-[9px] font-black uppercase tracking-widest" : "text-red-500 px-4 py-1 rounded-full text-[9px] font-black uppercase tracking-widest";
        });

        window.updateBalance = async () => {
            const user = document.getElementById('target-user').value.trim();
            const amt = parseFloat(document.getElementById('add-amt').value);
            const userRef = ref(db, 'users/' + user);
            const snap = await get(userRef);
            if(snap.exists()){
                const current = snap.val().balance || 0;
                await update(userRef, { balance: current + amt });
                alert("Balance Pushed!");
            } else { alert("User not found!"); }
        };

        onValue(ref(db, 'purchases'), (snap) => {
            const list = document.getElementById('purchase-list');
            list.innerHTML = "";
            const data = snap.val();
            if(data) Object.keys(data).reverse().forEach(k => {
                const p = data[k];
                list.innerHTML += `
                    <div class="bg-black p-5 rounded-3xl border border-zinc-800">
                        <p class="text-[9px] text-blue-500 font-black uppercase mb-1">Task Unlocked: ${p.taskID}</p>
                        <p class="font-black text-lg italic text-white">${p.username}</p>
                        <p class="text-[10px] text-green-500 font-bold mt-2">Paid: ₹${p.plan}</p>
                    </div>`;
            });
        });

        onValue(ref(db, 'users'), (snap) => {
            const list = document.getElementById('user-list');
            list.innerHTML = "";
            const data = snap.val();
            if(data) Object.keys(data).forEach(username => {
                const u = data[username];
                const p = u.permissions || {};
                list.innerHTML += `
                <div class="bg-black p-6 rounded-[2.5rem] border border-zinc-800 flex flex-col items-center text-center">
                    <p class="font-black text-lg italic mb-1 text-white">${u.name}</p>
                    <p class="text-[9px] text-zinc-500 font-bold uppercase tracking-widest mb-4">Bal: ₹${u.balance || 0}</p>
                    <div class="grid grid-cols-2 gap-2 w-full pt-4 border-t border-zinc-900">
                        <button onclick="toggleT('${username}', 9, ${p.task9})" class="p-2 rounded-xl text-[8px] font-black uppercase ${p.task9 ? 'bg-green-600 text-white' : 'bg-zinc-800 text-zinc-500'}">T9: ${p.task9 ? 'ON' : 'OFF'}</button>
                        <button onclick="toggleT('${username}', 11, ${p.task11})" class="p-2 rounded-xl text-[8px] font-black uppercase ${p.task11 ? 'bg-green-600 text-white' : 'bg-zinc-800 text-zinc-500'}">T11: ${p.task11 ? 'ON' : 'OFF'}</button>
                        <button onclick="toggleT('${username}', 16, ${p.task16})" class="p-2 rounded-xl text-[8px] font-black uppercase ${p.task16 ? 'bg-green-600 text-white' : 'bg-zinc-800 text-zinc-500'}">T16: ${p.task16 ? 'ON' : 'OFF'}</button>
                        <button onclick="toggleT('${username}', 21, ${p.task21})" class="p-2 rounded-xl text-[8px] font-black uppercase ${p.task21 ? 'bg-green-600 text-white' : 'bg-zinc-800 text-zinc-500'}">T21: ${p.task21 ? 'ON' : 'OFF'}</button>
                    </div>
                </div>`;
            });
        });

        window.toggleT = async (user, id, current) => {
            await update(ref(db, `users/${user}/permissions`), { [`task${id}`]: !current });
        };
    </script>
</body>
</html>
