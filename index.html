<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MASTER ADMIN | TECH QA</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-white p-6 md:p-12 font-sans">
    <header class="flex justify-between items-end border-b border-zinc-900 pb-8 mb-12">
        <div>
            <h1 class="text-3xl font-black text-blue-500 italic uppercase">System Control</h1>
            <p id="status" class="text-zinc-500 text-[9px] uppercase font-bold tracking-[0.3em] mt-2 italic uppercase">Syncing...</p>
        </div>
    </header>

    <div class="grid lg:grid-cols-3 gap-10">
        <div class="bg-zinc-900/50 p-8 rounded-[2.5rem] border border-zinc-800 shadow-2xl h-fit">
            <h2 class="text-xl font-bold mb-8 text-green-500 italic uppercase">Balance Push</h2>
            <div class="space-y-4">
                <input id="target-user" type="text" placeholder="Username" class="w-full bg-black p-4 rounded-2xl border border-zinc-800 outline-none">
                <input id="add-amt" type="number" placeholder="Amount" class="w-full bg-black p-4 rounded-2xl border border-zinc-800 outline-none">
                <button onclick="updateBalance()" class="w-full bg-blue-600 py-4 rounded-2xl font-black uppercase text-xs italic">Submit</button>
            </div>
        </div>

        <div class="lg:col-span-2 bg-zinc-900/50 p-8 rounded-[2.5rem] border border-zinc-800 shadow-2xl">
            <h2 class="text-xl font-bold mb-8 text-indigo-400 italic text-center uppercase tracking-widest">User Control Center</h2>
            <div id="user-list" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, update, get, onValue, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBMUzq53tvH-ntEJsfRj08ReeGMSd_RmrY",
            databaseURL: "https://techqaportal-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "techqaportal"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        onValue(ref(db, ".info/connected"), (s) => {
            const el = document.getElementById('status');
            el.innerText = s.val() ? "● LIVE" : "● OFFLINE";
            el.className = s.val() ? "text-green-500 font-bold" : "text-red-500 font-bold";
        });

        onValue(ref(db, 'users'), (snap) => {
            const list = document.getElementById('user-list');
            list.innerHTML = "";
            const data = snap.val();
            if(data) Object.keys(data).forEach(username => {
                const u = data[username];
                const d = u.depositDetails || { acc: "", upi: "" };
                list.innerHTML += `
                <div class="bg-black p-6 rounded-[2.5rem] border border-zinc-800">
                    <p class="font-black italic text-center uppercase mb-1">${u.name}</p>
                    <p class="text-[9px] text-zinc-600 font-bold uppercase text-center mb-4 italic">Bal: ₹${u.balance || 0}</p>
                    
                    <div class="space-y-2 mb-4 bg-zinc-900 p-4 rounded-2xl">
                        <input id="acc-${username}" value="${d.acc}" placeholder="Bank Acc" class="w-full bg-black text-[9px] p-2 rounded border border-zinc-800 outline-none">
                        <input id="upi-${username}" value="${d.upi}" placeholder="UPI ID" class="w-full bg-black text-[9px] p-2 rounded border border-zinc-800 outline-none">
                        <button onclick="savePayment('${username}')" class="w-full bg-zinc-800 py-2 rounded text-[8px] font-black uppercase italic">Save Payment</button>
                    </div>

                    <div class="grid grid-cols-2 gap-2 mt-4">
                        <button onclick="toggleT('${username}', 9, ${u.permissions?.task9})" class="p-1 rounded text-[7px] font-black uppercase ${u.permissions?.task9 ? 'bg-green-600' : 'bg-zinc-800'}">T9</button>
                        <button onclick="resetBal('${username}')" class="p-1 rounded text-[7px] font-black uppercase bg-red-900/30 text-red-500">Reset Balance</button>
                    </div>
                </div>`;
            });
        });

        window.savePayment = async (username) => {
            const acc = document.getElementById('acc-' + username).value;
            const upi = document.getElementById('upi-' + username).value;
            await update(ref(db, 'users/' + username + '/depositDetails'), { acc, upi });
            alert("Payment details saved for " + username);
        };

        window.resetBal = async (username) => {
            if(confirm("Are you sure you want to reset balance to 0 for " + username + "?")) {
                await update(ref(db, 'users/' + username), { balance: 0 });
                alert("Balance reset to zero.");
            }
        };

        window.updateBalance = async () => {
            const user = document.getElementById('target-user').value.trim();
            const amt = parseFloat(document.getElementById('add-amt').value);
            const snap = await get(ref(db, 'users/' + user));
            if(snap.exists()){
                const current = snap.val().balance || 0;
                await update(ref(db, 'users/' + user), { balance: current + amt });
                alert("Balance Updated!");
            } else { alert("User not found!"); }
        };

        window.toggleT = async (user, id, current) => {
            await update(ref(db, 'users/' + user + '/permissions'), { ['task' + id]: !current });
        };
    </script>
</body>
</html>
