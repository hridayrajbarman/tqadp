<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TECH QA ADMIN</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white p-6">
    <h1 class="text-3xl font-black text-blue-500 mb-10">TECH QA ADMIN</h1>
    <div class="grid lg:grid-cols-2 gap-10">
        <div class="bg-gray-900 p-6 rounded-3xl border border-gray-800">
            <h2 class="text-xl font-bold mb-4 italic">Add User Balance</h2>
            <input id="target-user" type="text" placeholder="Exact Username" class="w-full p-3 bg-black rounded-xl mb-3 border border-gray-700">
            <input id="add-amt" type="number" placeholder="Amount to add" class="w-full p-3 bg-black rounded-xl mb-6 border border-gray-700">
            <button onclick="updateBalance()" class="w-full bg-blue-600 py-3 rounded-xl font-bold">SEND MONEY</button>
        </div>
        <div class="bg-gray-900 p-6 rounded-3xl border border-gray-800">
            <h2 class="text-xl font-bold mb-4">Withdrawal Logs</h2>
            <div id="logs" class="space-y-3"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, update, get, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBMUzq53tvH-ntEJsfRj08ReeGMSd_RmrY",
            databaseURL: "https://techqaportal-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "techqaportal"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.updateBalance = async () => {
            const user = document.getElementById('target-user').value.trim();
            const amt = parseFloat(document.getElementById('add-amt').value);
            const userRef = ref(db, 'users/' + user);
            const snap = await get(userRef);
            if(snap.exists()){
                await update(userRef, { balance: (snap.val().balance || 0) + amt });
                alert("Success!");
            } else { alert("User not found"); }
        };

        onValue(ref(db, 'withdrawals'), (snap) => {
            const list = document.getElementById('logs');
            list.innerHTML = "";
            const data = snap.val();
            if(data) Object.keys(data).forEach(k => {
                const r = data[k];
                list.innerHTML += `<div class="bg-black p-4 rounded-xl border border-gray-700">
                    <p class="font-bold text-orange-400">${r.user} - ₹${r.amount}</p>
                    <p class="text-[10px] text-gray-500">ACC: ${r.acc} | IFSC: ${r.ifsc || 'N/A'}</p>
                    <button onclick="remove(ref(db, 'withdrawals/${k}'))" class="mt-2 text-[9px] bg-red-900/20 text-red-500 px-2 py-1 rounded">Mark Paid & Delete</button>
                </div>`;
            });
        });
    </script>
</body>
</html>
