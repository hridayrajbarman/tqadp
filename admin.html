<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TECH QA | MASTER ADMIN</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white p-4 md:p-10">

    <header class="mb-10 border-b border-gray-800 pb-5">
        <h1 class="text-3xl font-black text-blue-500">TECH QA ADMIN PANEL</h1>
        <p class="text-xs text-gray-500">MANAGE USERS, BALANCES, AND WITHDRAWALS</p>
    </header>

    <div class="grid lg:grid-cols-3 gap-8">
        
        <div class="bg-gray-900 p-6 rounded-3xl border border-gray-800 shadow-2xl">
            <h2 class="text-xl font-bold mb-6 text-green-400">Add Balance</h2>
            <div class="space-y-4">
                <input id="target-user" type="text" placeholder="Exact Username" class="w-full bg-black border border-gray-700 p-3 rounded-xl outline-none">
                <input id="add-amt" type="number" placeholder="Amount to Add" class="w-full bg-black border border-gray-700 p-3 rounded-xl outline-none">
                <button onclick="updateBalance()" class="w-full bg-blue-600 py-3 rounded-xl font-bold">UPDATE USER</button>
            </div>
        </div>

        <div class="lg:col-span-2 bg-gray-900 p-6 rounded-3xl border border-gray-800">
            <h2 class="text-xl font-bold mb-6 text-orange-400">Withdrawal Requests</h2>
            <div id="logs" class="grid md:grid-cols-2 gap-4 max-h-[500px] overflow-y-auto pr-2">
                <p class="text-gray-600 italic">Listening for requests...</p>
            </div>
        </div>

        <div class="lg:col-span-3 bg-gray-900 p-6 rounded-3xl border border-gray-800">
            <h2 class="text-xl font-bold mb-6 text-blue-400">Registered Users (Mobile & Email)</h2>
            <div id="user-list" class="grid md:grid-cols-3 gap-4 overflow-y-auto">
                <p class="text-gray-600 italic">Loading users...</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, update, get, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // YOUR CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyBMUzq53tvH-ntEJsfRj08ReeGMSd_RmrY",
            databaseURL: "https://techqaportal-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "techqaportal"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // UPDATE USER BALANCE
        window.updateBalance = async () => {
            const user = document.getElementById('target-user').value.trim();
            const amt = parseFloat(document.getElementById('add-amt').value);
            const userRef = ref(db, 'users/' + user);
            const snap = await get(userRef);
            if(snap.exists()){
                await update(userRef, { balance: (snap.val().balance || 0) + amt });
                alert("Success: New Balance ₹" + ((snap.val().balance || 0) + amt));
            } else { alert("User not found"); }
        };

        // SHOW WITHDRAWALS
        onValue(ref(db, 'withdrawals'), (snap) => {
            const list = document.getElementById('logs');
            list.innerHTML = "";
            const data = snap.val();
            if(data) Object.keys(data).forEach(k => {
                const r = data[k];
                list.innerHTML += `
                <div class="bg-black p-4 rounded-xl border border-gray-800">
                    <p class="font-bold text-orange-400">${r.user} - ₹${r.amount}</p>
                    <p class="text-[10px] text-gray-500 uppercase mt-1">Acc: ${r.acc}</p>
                    <button onclick="remove(ref(db, 'withdrawals/${k}'))" class="mt-3 text-[10px] bg-red-900/20 text-red-500 px-3 py-1 rounded">Mark Paid & Delete</button>
                </div>`;
            });
        });

        // SHOW ALL USER DETAILS
        onValue(ref(db, 'users'), (snap) => {
            const list = document.getElementById('user-list');
            list.innerHTML = "";
            const data = snap.val();
            if(data) Object.keys(data).forEach(k => {
                const u = data[k];
                list.innerHTML += `
                <div class="bg-black p-4 rounded-xl border border-gray-700">
                    <p class="font-bold text-blue-400">${u.name || u.username}</p>
                    <p class="text-[11px] text-gray-400 mt-1">📞 ${u.mobile || 'N/A'}</p>
                    <p class="text-[11px] text-gray-400">📧 ${u.email || 'N/A'}</p>
                    <p class="text-[11px] font-bold text-green-500 mt-2">Bal: ₹${u.balance || 0}</p>
                </div>`;
            });
        });
    </script>
</body>
</html>
